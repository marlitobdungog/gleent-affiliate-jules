services:
  frontend:
    image: ${WEB:?WEB image is missing from release.json}
    restart: unless-stopped
    networks:
      - gleent_affiliate

  backend:
    image: ${API:?API image is missing from release.json}
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Set APP_KEY in /etc/gleent-affiliate/.env}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-gleent_affiliate}
      DB_USERNAME: ${DB_USERNAME:-gleent_affiliate}
      DB_PASSWORD: ${DB_PASSWORD:-gleent_affiliate}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      APP_URL: ${APP_URL:-http://localhost:8089}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8089}
      AFFILIATE_SHORT_LINKS_ENABLED: ${AFFILIATE_SHORT_LINKS_ENABLED:-true}
      AFFILIATE_SHORT_LINK_BASE_URL: ${AFFILIATE_SHORT_LINK_BASE_URL:-http://localhost:8089}
      AFFILIATE_CLICK_TOKEN_TTL_MINUTES: ${AFFILIATE_CLICK_TOKEN_TTL_MINUTES:-10}
      AFFILIATE_LEAD_CAPTURE_TOKEN: ${AFFILIATE_LEAD_CAPTURE_TOKEN:-}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8089,127.0.0.1,127.0.0.1:8089}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8001}
      AUTH_SERVICE_BROWSER_URL: ${AUTH_SERVICE_BROWSER_URL:-http://localhost:8001}
      AUTH_SERVICE_INTERNAL_API_KEY: ${AUTH_SERVICE_INTERNAL_API_KEY:-}
      AUTH_SERVICE_AFFILIATE_CLIENT_ID: ${AUTH_SERVICE_AFFILIATE_CLIENT_ID:-}
      AUTH_SERVICE_AFFILIATE_CLIENT_SECRET: ${AUTH_SERVICE_AFFILIATE_CLIENT_SECRET:-}
      AUTH_SERVICE_AFFILIATE_ONBOARDING_CLIENT_ID: ${AUTH_SERVICE_AFFILIATE_ONBOARDING_CLIENT_ID:-}
      AUTH_SERVICE_AFFILIATE_ONBOARDING_CLIENT_SECRET: ${AUTH_SERVICE_AFFILIATE_ONBOARDING_CLIENT_SECRET:-}
      AUTH_SERVICE_AFFILIATE_CALLBACK_URL: ${AUTH_SERVICE_AFFILIATE_CALLBACK_URL:-http://localhost:8089/api/sso/callback}
      AUTH_SERVICE_AFFILIATE_APPLICATION_CODE: ${AUTH_SERVICE_AFFILIATE_APPLICATION_CODE:-affiliate}
      AUTH_SERVICE_AFFILIATE_ONBOARDING_APPLICATION_CODE: ${AUTH_SERVICE_AFFILIATE_ONBOARDING_APPLICATION_CODE:-affiliate-onboarding}
      AUTH_SERVICE_TENANT_SLUG: ${AUTH_SERVICE_TENANT_SLUG:-gleent}
      AUTH_SERVICE_CONNECT_TIMEOUT_SECONDS: ${AUTH_SERVICE_CONNECT_TIMEOUT_SECONDS:-3}
      AUTH_SERVICE_TIMEOUT_SECONDS: ${AUTH_SERVICE_TIMEOUT_SECONDS:-10}
    command: >
      sh -lc "mysql --skip-ssl -h \"$${DB_HOST}\" -P \"$${DB_PORT}\" -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e \"CREATE DATABASE IF NOT EXISTS $${DB_DATABASE}; CREATE DATABASE IF NOT EXISTS $${DB_DATABASE}_test; CREATE USER IF NOT EXISTS '$${DB_USERNAME}'@'%' IDENTIFIED BY '$${DB_PASSWORD}'; GRANT ALL PRIVILEGES ON $${DB_DATABASE}.* TO '$${DB_USERNAME}'@'%'; GRANT ALL PRIVILEGES ON $${DB_DATABASE}_test.* TO '$${DB_USERNAME}'@'%'; FLUSH PRIVILEGES;\" && php artisan migrate --force --no-interaction && php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gleent_affiliate

  web:
    image: ${PROXY:?PROXY image is missing from release.json}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8089}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - gleent_affiliate

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gleent_affiliate}
      MYSQL_USER: ${DB_USERNAME:-gleent_affiliate}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gleent_affiliate}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_EXPOSE_PORT:-3311}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gleent_affiliate

volumes:
  mysql_data:

networks:
  gleent_affiliate:
    name: gleent_affiliate
    driver: bridge
